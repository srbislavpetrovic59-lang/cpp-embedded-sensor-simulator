<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Telemetry Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial;
            background: #1e1e1e;
            color: white;
            padding: 30px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            width: 220px;
            text-align: center;
        }

        .value {
            font-size: 42px;
            margin-top: 10px;
        }

        .alarm {
            border: 3px solid red;
        }
    </style>
</head>

<body>

    <h1>Embedded Telemetry Dashboard</h1>

    <div class="container">

        <div class="card" id="tempCard">
            <h2>Temperature</h2>
            <div class="value"><span id="temp">--</span> °C</div>
        </div>

        <div class="card" id="presCard">
            <h2>Pressure</h2>
            <div class="value"><span id="pres">--</span> hPa</div>
        </div>

        <div class="card" id="humCard">
            <h2>Humidity</h2>
            <div class="value"><span id="hum">--</span> %</div>
        </div>

    </div>
    <p id="status">Connecting...</p>
    <canvas id="historyChart" width="900" height="300"></canvas>
    <script>

        async function updateData() {
            try {
                const response =
                    await fetch("http://127.0.0.1:8080/latest");

                const data = await response.json();
                console.log(data);

                document.getElementById("temp").innerText =
                    Number(data.temperature).toFixed(2);

                document.getElementById("pres").innerText =
                    Number(data.pressure).toFixed(2);

                document.getElementById("hum").innerText =
                    Number(data.humidity).toFixed(2);

                document.getElementById("status").innerText =
                    "Connected - live data";

                // alarms

                document.getElementById("tempCard")
                    .classList.toggle(
                        "alarm",
                        data.temperature > 30
                    );

                document.getElementById("presCard")
                    .classList.toggle(
                        "alarm",
                        data.pressure > 1020
                    );

                document.getElementById("humCard")
                    .classList.toggle(
                        "alarm",
                        data.humidity > 70
                    );
            }
            catch (err) {
                document.getElementById("status").innerText =
                    "Disconnected - REST server not reachable";
                console.log(err);
            }
        }

        setInterval(updateData, 1000);

        updateData();
        let historyChart;

async function updateHistoryChart()
{
    console.log("Chart object:", typeof Chart);
    try
    {
        const response =
            await fetch("http://127.0.0.1:8080/history");

        const history = await response.json();

        const tempData = [];
        const humData = [];
        const presData = [];
        const labels = [];

        history.reverse();

        history.forEach(item =>
        {
            labels.push(item.timestamp);

            if (item.sensor === "TEMP")
                tempData.push(item.value);
            else
                tempData.push(null);

            if (item.sensor === "HUM")
                humData.push(item.value);
            else
                humData.push(null);

            if (item.sensor === "PRES")
                presData.push(item.value);
            else
                presData.push(null);
        });

        const ctx =
            document.getElementById("historyChart");

        if (historyChart)
            historyChart.destroy();

        historyChart = new Chart(ctx,
        {
            type: "line",

            data:
            {
                labels: labels,

                datasets:
                [
                    {
                        label: "Temperature",
                        data: tempData,
                        spanGaps: true
                    },
                    {
                        label: "Pressure",
                        data: presData,
                        spanGaps: true
                    },
                    {
                        label: "Humidity",
                        data: humData,
                        spanGaps: true
                    }
                ]
            }
        });
    }
    catch(err)
    {
        console.log(err);
    }
}

updateHistoryChart();

        setInterval(updateHistoryChart, 5000);
        const socket = new WebSocket("ws://127.0.0.1:8090");

        socket.onopen = function () {
            document.getElementById("status").innerText =
                "Connected - WebSocket live data";
        };

        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);

            if (data.sensor === "TEMP") {
                document.getElementById("temp").innerText =
                    Number(data.value).toFixed(2);
            }

            if (data.sensor === "PRES") {
                document.getElementById("pres").innerText =
                    Number(data.value).toFixed(2);
            }

            if (data.sensor === "HUM") {
                document.getElementById("hum").innerText =
                    Number(data.value).toFixed(2);
            }
        };

        socket.onerror = function () {
            document.getElementById("status").innerText =
                "WebSocket error";
        };

        socket.onclose = function () {
            document.getElementById("status").innerText =
                "WebSocket disconnected";
        };

    </script>

</body>

</html>
